    <text x="208" y="272" font-size="11.5" font-weight="650" fill="#F2F4F8">Adaptive Bandwidth Telemetry (4-Tier RTT)</text>
    <path d="M208 326 L246 318 L284 322 L322 302 L360 308 L398 294 L436 298 L474 288 L512 292" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="292" r="4" fill="#34D399"/>
    <text x="208" y="344" font-size="8.9" fill="#6E788E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ultra 1024×640 · low 1152×720 · med 1280×800 · high 1440×920</text>

    <!-- Pointer Cursor Accent -->
    <path d="M312 196 L328 206 L319 209 L316 218 Z" fill="#F2F4F8" stroke="#6895FF" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Footer Status Bar of Stage -->
    <text x="20" y="399" font-size="11" fill="#6E788E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">SEP-1865 · relay.sock (0600) · 127.0.0.1 loopback only</text>
    <text x="544" y="399" text-anchor="end" font-size="11" fill="#34D399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 external URLs</text>
