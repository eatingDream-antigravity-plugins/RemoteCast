    <text x="2" y="138" font-size="52" font-weight="800" fill="#F2F4F8" letter-spacing="-1.1">Remote Cast</text>
    <text x="2" y="192" font-size="52" font-weight="800" fill="#6895FF" letter-spacing="-1.1">MCP</text>
