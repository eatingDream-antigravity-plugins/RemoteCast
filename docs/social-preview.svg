<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Display',Helvetica,Arial,sans-serif">
  <title id="t">Remote Cast — Native Rust Chrome DevTools Screencast Relay &amp; MCP App</title>
  <desc id="d">Social preview card for eatingDream-antigravity-plugins/remote-cast featuring the Remote Cast Lucid Indigo UI mockup and key architecture highlights.</desc>
  <defs>
