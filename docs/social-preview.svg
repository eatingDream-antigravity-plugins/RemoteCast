    <!-- Tagline -->
    <text x="2" y="242" font-size="19" fill="#F2F4F8" font-weight="500">Native Rust Chrome DevTools screencast relay</text>
    <text x="2" y="270" font-size="19" fill="#A6B0C3" font-weight="400">&amp; zero-flash MCP App viewer for weak networks.</text>

    <!-- 2x2 Feature Cards -->
    <g transform="translate(0, 304)">
      <rect x="0" y="0" width="268" height="64" rx="12" fill="#12151E" stroke="#23293A"/>
      <circle cx="20" cy="23" r="4.5" fill="#6895FF"/>
      <text x="34" y="27" font-size="14" font-weight="700" fill="#F2F4F8">Single Native Rust Binary</text>
      <text x="20" y="48" font-size="12" fill="#A6B0C3">Zero runtime · loopback RFC 6455 WS</text>

      <rect x="284" y="0" width="268" height="64" rx="12" fill="#12151E" stroke="#23293A"/>
      <circle cx="304" cy="23" r="4.5" fill="#34D399"/>
      <text x="318" y="27" font-size="14" font-weight="700" fill="#F2F4F8">0600 Persistent CDP Relay</text>
      <text x="304" y="48" font-size="12" fill="#A6B0C3">Single Allow · 12s idle GPU sleep</text>

      <rect x="0" y="78" width="268" height="64" rx="12" fill="#12151E" stroke="#23293A"/>
      <circle cx="20" cy="101" r="4.5" fill="#FBBF24"/>
      <text x="34" y="105" font-size="14" font-weight="700" fill="#F2F4F8">4-Tier RTT + SHA-1 Dedup</text>
      <text x="20" y="126" font-size="12" fill="#A6B0C3">unchanged:true · coalesced inputs</text>

      <rect x="284" y="78" width="268" height="64" rx="12" fill="#12151E" stroke="#23293A"/>
      <circle cx="304" cy="101" r="4.5" fill="#82A8FF"/>
      <text x="318" y="105" font-size="14" font-weight="700" fill="#F2F4F8">Zero-Flash &lt;= 64 KiB UI</text>
      <text x="304" y="126" font-size="12" fill="#A6B0C3">Zero-tab safe · explicit Pause/Disconnect</text>
    </g>

    <!-- Bottom Repo Line -->
