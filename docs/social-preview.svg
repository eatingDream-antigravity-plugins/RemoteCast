    <text x="2" y="232" font-size="18.5" fill="#F2F4F8" font-weight="500">Stream tabs, click, type &amp; switch profiles without</text>
    <text x="2" y="260" font-size="18.5" fill="#A6B0C3" font-weight="400">stealing window focus — crisp stills over slow links.</text>

