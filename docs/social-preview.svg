      <path d="M72 58.5 L90 67.5 L80.5 70.8 L77.2 80.2 Z" fill="#F2F4F8" stroke="#6895FF" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Org Pill -->
