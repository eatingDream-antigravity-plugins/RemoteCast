<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Display',Helvetica,Arial,sans-serif">
  <title id="t">Remote Cast — Native Rust Chrome DevTools Screencast Relay &amp; MCP App</title>
  <desc id="d">Social preview card for eatingDream-antigravity-plugins/remote-cast featuring the Remote Cast Lucid Indigo UI mockup and key architecture highlights.</desc>
  <defs>
    <radialGradient id="glow-indigo" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#6895FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="15%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-bg" x1="14" y1="12" x2="114" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181C28"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="logo-rim" x1="14" y1="12" x2="114" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6895FF" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#F2F4F8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2952CC" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="indigo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#82A8FF"/>
      <stop offset="100%" stop-color="#6895FF"/>
    </linearGradient>
    <filter id="stage-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F2F4F8" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Base Dark Lucid Indigo Surface -->
