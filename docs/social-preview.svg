    <path d="M373 29 H391" stroke="#6895FF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M387 24 L394 29 L387 34" fill="none" stroke="#6895FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="398" y="0" width="166" height="58" rx="12" fill="#12151E" stroke="#82A8FF" stroke-opacity="0.45"/>
    <text x="481" y="25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F2F4F8">Google Chrome</text>
