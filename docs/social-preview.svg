  <rect width="1280" height="640" fill="url(#glow-indigo)"/>
  <rect width="1280" height="640" fill="url(#glow-emerald)"/>
  <rect x="16" y="16" width="1248" height="608" rx="22" fill="none" stroke="#23293A" stroke-width="1.5"/>

  <!-- LEFT COLUMN: Brand, Headline, Features -->
  <g transform="translate(64, 72)">
    <!-- Embedded Logo Mark (72x72) -->
    <g transform="scale(0.5625)">
      <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#logo-bg)" stroke="url(#logo-rim)" stroke-width="2.8"/>
      <path d="M28 43 C28 36.4 33.4 31 40 31 H57 C61.5 31 63.6 34.4 66.2 38 H88 C94.6 38 100 43.4 100 50 V84 C100 90.6 94.6 96 88 96 H40 C33.4 96 28 90.6 28 84 Z" fill="#12151E" stroke="#F2F4F8" stroke-opacity="0.88" stroke-width="2.6"/>
