    <text x="453" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#F2F4F8">Pause</text>

    <rect x="486" y="54" width="64" height="24" rx="6" fill="#1D2231" stroke="#6895FF" stroke-opacity="0.6"/>
    <text x="518" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#82A8FF">Disconnect</text>

