    <rect x="46" y="136" width="84" height="10" rx="5" fill="#6895FF" fill-opacity="0.85"/>
    <rect x="46" y="160" width="114" height="8" rx="4" fill="#1D2231"/>
    <rect x="46" y="178" width="96" height="8" rx="4" fill="#181C28"/>
    <rect x="46" y="196" width="108" height="8" rx="4" fill="#181C28"/>
    <rect x="46" y="226" width="116" height="44" rx="8" fill="#181C28" stroke="#2B3246"/>
    <text x="58" y="245" font-size="10.5" font-weight="650" fill="#34D399">SHA-1 Dedup</text>
    <text x="58" y="261" font-size="10" fill="#A6B0C3">0 B unchanged</text>
    <rect x="46" y="282" width="116" height="56" rx="8" fill="#181C28" stroke="#2B3246"/>
    <text x="58" y="302" font-size="10.5" font-weight="650" fill="#82A8FF">Profile: High</text>
    <text x="58" y="318" font-size="10" fill="#A6B0C3">1440×920 · q84</text>
    <text x="58" y="331" font-size="9.5" fill="#6E788E">RTT 38 ms · 1x</text>

    <!-- Main Pane Inside Screencast -->
    <rect x="190" y="120" width="342" height="118" rx="8" fill="#12151E" stroke="#23293A"/>
    <text x="208" y="148" font-size="14" font-weight="700" fill="#F2F4F8">Interactive CDP Screencast Stream</text>
    <text x="208" y="168" font-size="11.5" fill="#A6B0C3">Click, scroll, type, navigate &amp; switch tabs over</text>
    <text x="208" y="185" font-size="11.5" fill="#A6B0C3">a single persistent loopback relay connection.</text>
    <rect x="208" y="200" width="98" height="24" rx="6" fill="url(#indigo-accent)"/>
    <text x="257" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0D12">Inspect Tab</text>
    <rect x="316" y="200" width="118" height="24" rx="6" fill="#181C28" stroke="#2B3246"/>
    <text x="375" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#F2F4F8">Zero-Tab Safe</text>

