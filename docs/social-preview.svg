    <circle cx="104" cy="35" r="4.5" fill="#34D399"/>
    <text x="118" y="39.5" font-size="12.5" font-weight="600" fill="#F2F4F8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">eatingDream-antigravity-plugins</text>

