  <text x="326" y="174" font-size="11" fill="#A9A296">&lt; 0.5 ms 响应首屏 SSR 快照</text>

  <g filter="url(#card-shadow)">
    <rect x="312" y="198" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
