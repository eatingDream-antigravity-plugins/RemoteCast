<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">Remote Cast 架构图</title>
  <desc id="d">四层本地架构：零闪烁 SEP-1865 MCP App 面板经由 stdio JSON-RPC 与 chrome-stream-mcp serve 通信，通过 0600 Unix 套接字多路复用至常驻 chrome-stream-mcp relay 守护进程，再经由本地回环 RFC 6455 WebSocket 连接 Google Chrome CDP。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1120" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6895FF"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#34D399"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="1119" height="619" rx="18" fill="url(#bg-grad)" stroke="#2E2B26"/>

  <!-- Header -->
  <text x="560" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#F2F4F8">Remote Cast · 本地回环 CDP 中继与零闪烁 MCP App 架构</text>
  <text x="560" y="57" text-anchor="middle" font-size="12" fill="#9E978B">单一原生 Rust 二进制 · 0600 持久化 Unix 套接字 · 四档弱网自适应投屏</text>

  <!-- Column 1: MCP App Stage -->
  <rect x="24" y="78" width="242" height="328" rx="14" fill="#12151E" stroke="#6895FF" stroke-opacity="0.45"/>
  <text x="145" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#82A8FF">1 · MCP App 舞台界面</text>
  <text x="145" y="120" text-anchor="middle" font-size="10.5" fill="#9E978B">SEP-1865 iframe · panel/dist/panel.html</text>

  <g filter="url(#card-shadow)">
    <rect x="36" y="134" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="36" y="134" width="4" height="54" rx="2" fill="#6895FF"/>
  </g>
  <text x="50" y="156" font-size="13" font-weight="650" fill="#F2F4F8">暗色优先零闪烁面板</text>
  <text x="50" y="174" font-size="11" fill="#A9A296">&lt; 42 KiB · CSP default-src 'none'</text>

  <g filter="url(#card-shadow)">
    <rect x="36" y="198" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="36" y="198" width="4" height="54" rx="2" fill="#6895FF"/>
  </g>
  <text x="50" y="220" font-size="13" font-weight="650" fill="#F2F4F8">透明背景与主题防护</text>
  <text x="50" y="238" font-size="11" fill="#A9A296">拦截 alpha &lt; 0.9 的宿主背景变量</text>

  <g filter="url(#card-shadow)">
    <rect x="36" y="262" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="36" y="262" width="4" height="54" rx="2" fill="#6895FF"/>
  </g>
  <text x="50" y="284" font-size="13" font-weight="650" fill="#F2F4F8">显式会话生命周期控制</text>
  <text x="50" y="302" font-size="11" fill="#A9A296">连接 · 暂停/恢复 · 一键断开</text>

  <g filter="url(#card-shadow)">
    <rect x="36" y="326" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="36" y="326" width="4" height="54" rx="2" fill="#6895FF"/>
  </g>
  <text x="50" y="348" font-size="13" font-weight="650" fill="#F2F4F8">双缓冲离屏渲染</text>
