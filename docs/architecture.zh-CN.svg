  <g filter="url(#card-shadow)">
    <rect x="864" y="198" width="220" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="864" y="198" width="4" height="54" rx="2" fill="#8C9EFF"/>
  </g>
  <text x="878" y="220" font-size="13" font-weight="650" fill="#F2F4F8">调试端点自动发现</text>
  <text x="878" y="238" font-size="11" fill="#A9A296">DevToolsActivePort 或 :9222</text>

  <g filter="url(#card-shadow)">
    <rect x="864" y="262" width="220" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="864" y="262" width="4" height="54" rx="2" fill="#8C9EFF"/>
  </g>
  <text x="878" y="284" font-size="13" font-weight="650" fill="#F2F4F8">尊重零标签页状态</text>
  <text x="878" y="302" font-size="11" fill="#A9A296">无标签页时绝不强建 about:blank</text>

  <g filter="url(#card-shadow)">
    <rect x="864" y="326" width="220" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="864" y="326" width="4" height="54" rx="2" fill="#8C9EFF"/>
