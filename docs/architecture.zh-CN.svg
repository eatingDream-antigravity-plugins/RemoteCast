  <g filter="url(#card-shadow)">
    <rect x="312" y="262" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="312" y="262" width="4" height="54" rx="2" fill="#E0A458"/>
  </g>
  <text x="326" y="284" font-size="13" font-weight="650" fill="#F2F4F8">并发 JSON-RPC 调度</text>
  <text x="326" y="302" font-size="11" fill="#A9A296">键鼠输入绝不被帧长轮询阻塞</text>

  <g filter="url(#card-shadow)">
    <rect x="312" y="326" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="312" y="326" width="4" height="54" rx="2" fill="#E0A458"/>
  </g>
  <text x="326" y="348" font-size="13" font-weight="650" fill="#F2F4F8">响应载荷自动脱敏</text>
  <text x="326" y="366" font-size="11" fill="#A9A296">剥离本机路径、WS 令牌与主机名</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="546" y1="242" x2="572" y2="242" stroke="#6895FF" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <text x="559" y="230" text-anchor="middle" font-size="9.5" fill="#B8B2A6">0600</text>

  <!-- Column 3: Persistent Relay Daemon -->
  <rect x="576" y="78" width="242" height="328" rx="14" fill="#12151E" stroke="#34D399" stroke-opacity="0.5"/>
  <text x="697" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#63B888">3 · 常驻 CDP 中继守护进程</text>
  <text x="697" y="120" text-anchor="middle" font-size="10.5" fill="#9E978B">chrome-stream-mcp relay（独立驻留）</text>

  <g filter="url(#card-shadow)">
    <rect x="588" y="134" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="588" y="134" width="4" height="54" rx="2" fill="#34D399"/>
  </g>
  <text x="602" y="156" font-size="13" font-weight="650" fill="#F2F4F8">一次授权持久复用</text>
  <text x="602" y="174" font-size="11" fill="#A9A296">MCP 重载免重复弹窗 · relay.sock</text>

  <g filter="url(#card-shadow)">
    <rect x="588" y="198" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="588" y="198" width="4" height="54" rx="2" fill="#34D399"/>
  </g>
  <text x="602" y="220" font-size="13" font-weight="650" fill="#F2F4F8">四档 RTT 自适应画质</text>
  <text x="602" y="238" font-size="11" fill="#A9A296">ultra · low · medium · high + auto</text>

  <g filter="url(#card-shadow)">
    <rect x="588" y="262" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="588" y="262" width="4" height="54" rx="2" fill="#34D399"/>
  </g>
  <text x="602" y="284" font-size="13" font-weight="650" fill="#F2F4F8">SHA-1 帧内容去重</text>
  <text x="602" y="302" font-size="11" fill="#A9A296">unchanged:true 零字节 · tabsHash 省略</text>

  <g filter="url(#card-shadow)">
    <rect x="588" y="326" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="588" y="326" width="4" height="54" rx="2" fill="#34D399"/>
  </g>
  <text x="602" y="348" font-size="13" font-weight="650" fill="#F2F4F8">12 秒空闲自动休眠</text>
