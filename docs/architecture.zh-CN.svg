  <text x="421" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E6B472">2 · MCP Stdio 服务</text>
  <text x="421" y="120" text-anchor="middle" font-size="10.5" fill="#9E978B">chrome-stream-mcp serve</text>

  <g filter="url(#card-shadow)">
    <rect x="312" y="134" width="218" height="54" rx="9" fill="#23211D" stroke="#34312B"/>
    <rect x="312" y="134" width="4" height="54" rx="2" fill="#E0A458"/>
  </g>
