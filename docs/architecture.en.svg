  <text x="697" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#63B888">3 · Persistent CDP Relay</text>
  <text x="697" y="120" text-anchor="middle" font-size="10.5" fill="#9E978B">chrome-stream-mcp relay (detached)</text>

