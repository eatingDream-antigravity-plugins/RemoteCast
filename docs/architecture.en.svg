<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text',Helvetica,Arial,sans-serif">
  <title id="t">Chrome Stream MCP Architecture</title>
  <desc id="d">Four-layer local architecture: SEP-1865 zero-flash MCP App panel communicates over stdio JSON-RPC with chrome-stream-mcp serve, which multiplexes over a 0600 Unix domain socket to the persistent chrome-stream-mcp relay daemon, connecting via loopback RFC 6455 WebSocket to Google Chrome CDP.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1120" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97757"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4E9F72"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

