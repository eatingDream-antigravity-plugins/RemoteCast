  <text x="602" y="284" font-size="13" font-weight="650" fill="#F4F1EA">SHA-1 Frame Dedup</text>
  <text x="602" y="302" font-size="11" fill="#A9A296">unchanged:true · tabsHash elision</text>

  <g filter="url(#card-shadow)">
