  <text x="560" y="57" text-anchor="middle" font-size="12" fill="#9E978B">Single native Rust binary · Persistent 0600 Unix socket · 4-tier adaptive weak-network screencast</text>

  <!-- Column 1: MCP App Stage -->
  <rect x="24" y="78" width="242" height="328" rx="14" fill="#1C1B18" stroke="#D97757" stroke-opacity="0.45"/>
  <text x="145" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E5896B">1 · MCP App Stage (UI)</text>
  <text x="145" y="120" text-anchor="middle" font-size="10.5" fill="#9E978B">SEP-1865 iframe · panel/dist/panel.html</text>

  <g filter="url(#card-shadow)">
