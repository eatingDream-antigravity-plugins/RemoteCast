name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach release assets for (e.g. v0.1.0)"
        required: true
        type: string
      platforms:
        description: "Target platforms to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - linux
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build and attach release assets for"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ensure-release:
    name: Validate tag & ensure GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid release tag '$TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; will attach/update plugin archives."
          else
            ver="${TAG#v}"
            awk -v v="$ver" '/^###? / { p = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0; next } /^\[[^]]*\]: / { next } p' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then notes=(--notes-file release-notes.md); else notes=(--generate-notes); fi
            extra=()
            if [[ "$TAG" == *-* ]]; then extra=(--prerelease); fi
            gh release create "$TAG" \
              --title "$TAG" \
              "${extra[@]}" \
              "${notes[@]}"
          fi

  build-linux:
    name: Build plugin (x86_64-unknown-linux-gnu)
    needs: ensure-release
    if: ${{ inputs.platforms != 'macos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-x86_64
      - name: Build and verify panel bundle
        run: |
          node panel/build.mjs
          node --test panel/net-policy.test.mjs
      - name: Run Rust test suite
        run: cargo test --locked
      - name: Build, verify, and package Linux tarball
        run: |
          RUSTFLAGS="--remap-path-prefix=${HOME}=/build --remap-path-prefix=${PWD}=/src" \
            cargo build --release --locked --target "${TARGET}"
          bin="target/${TARGET}/release/chrome-stream-mcp"
          if strings "$bin" | grep -F -e "${HOME}" -e "${PWD}" >/dev/null 2>&1; then
            echo "error: runner HOME or PWD path leaked into release binary" >&2
            exit 1
          fi
          archive="chrome-stream-mcp-${TAG}-${TARGET}.tar.gz"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/bin" "$stage/panel/dist" "$stage/skills/chrome-stream" "$stage/assets" "$stage/docs"
          install -m 0755 "$bin" "$stage/bin/chrome-stream-mcp"
          cp panel/dist/panel.html "$stage/panel/dist/panel.html"
          cp plugin.json mcp_config.json LICENSE README.md llms.txt "$stage/"
          cp docs/ai-guide.md "$stage/docs/ai-guide.md"
          cp skills/chrome-stream/SKILL.md "$stage/skills/chrome-stream/SKILL.md"
          cp assets/logo.svg "$stage/assets/logo.svg"
          tar -C "$stage" -czf "$archive" \
            bin/chrome-stream-mcp panel/dist/panel.html plugin.json mcp_config.json \
            skills/chrome-stream/SKILL.md assets/logo.svg docs/ai-guide.md llms.txt LICENSE README.md
          sha256sum "$archive" > "${archive}.sha256"
          cat "${archive}.sha256"
      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="chrome-stream-mcp-${TAG}-${TARGET}.tar.gz"
          gh release upload "$TAG" "$archive" "${archive}.sha256" --clobber

  build-macos:
    name: Build plugin (macOS arm64 + x86_64)
    needs: ensure-release
    if: ${{ inputs.platforms != 'linux' }}
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-universal
      - name: Build and verify panel bundle
        run: |
          node panel/build.mjs
          node --test panel/net-policy.test.mjs
      - name: Run Rust test suite
        run: cargo test --locked
      - name: Build, verify, and package macOS tarballs
        run: |
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "=== Building ${TARGET} ==="
            RUSTFLAGS="--remap-path-prefix=${HOME}=/build --remap-path-prefix=${PWD}=/src" \
              cargo build --release --locked --target "${TARGET}"
            bin="target/${TARGET}/release/chrome-stream-mcp"
            if strings "$bin" | grep -F -e "${HOME}" -e "${PWD}" >/dev/null 2>&1; then
              echo "error: runner HOME or PWD path leaked into release binary (${TARGET})" >&2
              exit 1
            fi
            archive="chrome-stream-mcp-${TAG}-${TARGET}.tar.gz"
            stage="$(mktemp -d)"
            mkdir -p "$stage/bin" "$stage/panel/dist" "$stage/skills/chrome-stream" "$stage/assets" "$stage/docs"
            install -m 0755 "$bin" "$stage/bin/chrome-stream-mcp"
            cp panel/dist/panel.html "$stage/panel/dist/panel.html"
            cp plugin.json mcp_config.json LICENSE README.md llms.txt "$stage/"
            cp docs/ai-guide.md "$stage/docs/ai-guide.md"
            cp skills/chrome-stream/SKILL.md "$stage/skills/chrome-stream/SKILL.md"
            cp assets/logo.svg "$stage/assets/logo.svg"
            COPYFILE_DISABLE=1 tar -C "$stage" -czf "$archive" \
              bin/chrome-stream-mcp panel/dist/panel.html plugin.json mcp_config.json \
              skills/chrome-stream/SKILL.md assets/logo.svg docs/ai-guide.md llms.txt LICENSE README.md
            rm -rf "$stage"
            shasum -a 256 "$archive" > "${archive}.sha256"
            cat "${archive}.sha256"
          done
      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="chrome-stream-mcp-${TAG}-${TARGET}.tar.gz"
            gh release upload "$TAG" "$archive" "${archive}.sha256" --clobber
          done
